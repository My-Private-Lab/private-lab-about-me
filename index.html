<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout use env(safe-area-inset-*) on notched
         phones. Pinch-zoom is deliberately NOT disabled (accessibility); iOS
         focus-zoom is prevented in CSS by keeping form fields at >= 16px. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />

    <title>Igor Savin — Software Engineer &amp; Tech Lead</title>
    <meta
      name="description"
      content="Igor Savin — Software Engineer, Team Lead and Tech Lead. Building software since 2009."
    />
    <meta name="author" content="Igor Savin" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="canonical" href="https://isavin.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://isavin.dev/" />
    <meta property="og:title" content="Igor Savin — Software Engineer &amp; Tech Lead" />
    <meta
      property="og:description"
      content="Software Engineer, Team Lead and Tech Lead. Building software since 2009."
    />
    <meta property="og:image" content="https://isavin.dev/avatar.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Igor Savin — Software Engineer &amp; Tech Lead" />
    <meta
      name="twitter:description"
      content="Software Engineer, Team Lead and Tech Lead. Building software since 2009."
    />
    <meta name="twitter:image" content="https://isavin.dev/avatar.png" />

    <!-- Apply the saved (or OS) theme before first paint — no flash of the
         wrong theme. Keep in sync with src/hooks/useTheme.ts. -->
    <script>
      (function () {
        var mode = null;
        try { mode = localStorage.getItem('theme'); } catch (e) {}
        var dark = mode === 'dark' || mode === 'light'
          ? mode === 'dark'
          : !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#0d1117' : '#f6f8fa');
      })();
    </script>

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />


    <!-- Single-Page-App fallback for GitHub Pages: restore the deep-link
         path that 404.html stashed into the query string. -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
